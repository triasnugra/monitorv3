name: update-monitor
on:
  schedule: [{ cron: '17 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: update-monitor, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch.mjs
      - run: node scripts/build.mjs
      - name: Commit data
        if: always()
        run: |
          git config user.name monitor-bot
          git config user.email monitor-bot@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "data: update $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
